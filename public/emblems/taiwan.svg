<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="tw-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a194a"/>
      <stop offset="70%" stop-color="#000095"/>
      <stop offset="100%" stop-color="#000066"/>
    </radialGradient>
    <filter id="tw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Surface -->
  <rect width="800" height="500" rx="32" fill="url(#tw-bg)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Red Accent Trim Lines -->
  <path d="M24 120 L776 120" stroke="#fe0000" stroke-width="3" opacity="0.6"/>
  <path d="M24 380 L776 380" stroke="#fe0000" stroke-width="3" opacity="0.6"/>

  <!-- 12-Ray White Sun (Blue Sky with a White Sun) -->
  <g transform="translate(400, 240)" filter="url(#tw-glow)">
    <!-- Blue Backing Ring -->
    <circle r="120" fill="#000095" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- 12 Triangular Rays -->
    <!-- Ray formula: triangle pointing outwards with 30 deg intervals -->
    <g fill="#ffffff">
      <polygon points="0,-115 -14,-60 14,-60"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(30)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(60)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(90)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(120)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(150)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(180)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(210)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(240)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(270)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(300)"/>
      <polygon points="0,-115 -14,-60 14,-60" transform="rotate(330)"/>
    </g>

    <!-- Inner Blue Ring separating rays from core -->
    <circle r="60" fill="#000095"/>
    <!-- Central White Sun Disc -->
    <circle r="48" fill="#ffffff"/>
  </g>

  <!-- Typography & Official Metadata -->
  <text x="400" y="75" font-family="'Space Grotesk', 'Syne', sans-serif" font-size="34" font-weight="700" letter-spacing="0.28em" fill="#ffffff" text-anchor="middle">TAIWAN</text>
  <text x="400" y="105" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" letter-spacing="0.4em" fill="#fe5555" text-anchor="middle">臺灣 · BLUE SKY WHITE SUN</text>

  <!-- Technical Corner Marks -->
  <text x="48" y="60" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.6" letter-spacing="0.1em">FIG. TW-02 // EAST ASIA</text>
  <text x="752" y="60" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.6" letter-spacing="0.1em" text-anchor="end">LAT 25.0330° N</text>
  <text x="48" y="450" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.6" letter-spacing="0.1em">12-RAY NATIONAL EMBLEM</text>
  <text x="752" y="450" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.6" letter-spacing="0.1em" text-anchor="end">TAIPEI ALLIANCE</text>
</svg>
